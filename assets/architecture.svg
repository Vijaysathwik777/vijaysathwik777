<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111B2E"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>

    <linearGradient id="card-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162644"/>
      <stop offset="100%" stop-color="#0D182E"/>
    </linearGradient>

    <linearGradient id="connector-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="arch-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F2FE"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .head { font-size: 11px; fill: #00F2FE; font-weight: 700; letter-spacing: 2px; }
    .node-title { font-size: 12.5px; fill: #F8FAFC; font-weight: 700; letter-spacing: 0.5px; }
    .node-step { font-size: 9.5px; fill: #38BDF8; font-weight: 700; letter-spacing: 1.5px; }
    .node-desc { font-size: 10px; fill: #94A3B8; font-weight: 400; }
    .connector-txt { font-size: 8.5px; fill: #64748B; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- Container Base -->
  <rect width="1000" height="270" rx="12" fill="url(#arch-bg)"/>
  <rect width="1000" height="270" rx="12" fill="url(#arch-grid)"/>
  <rect x="1" y="1" width="998" height="268" rx="11" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Header Bar -->
  <g transform="translate(24, 28)">
    <circle cx="5" cy="5" r="3.5" fill="#00F2FE" filter="url(#cyan-glow)"/>
    <text class="mono head" x="16" y="8.5">AGENTIC ARCHITECTURE // DETERMINISTIC EXECUTION PIPELINE</text>
    <line x1="0" y1="20" x2="952" y2="20" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- ==================== FLOW CONNECTORS (Behind cards) ==================== -->
  <!-- 1 -> 2 -->
  <g transform="translate(182, 138)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="15" cy="0" r="2" fill="#00F2FE" filter="url(#cyan-glow)"/>
  </g>

  <!-- 2 -> 3 -->
  <g transform="translate(372, 138)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="15" cy="0" r="2" fill="#00F2FE" filter="url(#cyan-glow)"/>
  </g>

  <!-- 3 -> 4 -->
  <g transform="translate(562, 138)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#00F2FE" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <circle cx="15" cy="0" r="2.5" fill="#00F2FE" filter="url(#cyan-glow)"/>
  </g>

  <!-- 4 -> 5 -->
  <g transform="translate(772, 138)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="15" cy="0" r="2" fill="#00F2FE" filter="url(#cyan-glow)"/>
  </g>

  <!-- ==================== NODE 1: USER INPUT ==================== -->
  <g transform="translate(24, 76)">
    <rect width="158" height="135" rx="8" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="158" height="3" rx="1.5" fill="#38BDF8" opacity="0.6"/>
    <g transform="translate(14, 22)">
      <text class="mono node-step" x="0" y="0">STAGE 01</text>
      <text class="sans node-title" x="0" y="20">User Input</text>
      <text class="mono node-desc" x="0" y="44">◈ Natural Prompt</text>
      <text class="mono node-desc" x="0" y="60">◈ Goal Definition</text>
      <text class="mono node-desc" x="0" y="76">◈ Context Constraints</text>
      <text class="mono node-desc" x="0" y="92">◈ Execution Scope</text>
    </g>
  </g>

  <!-- ==================== NODE 2: AI APPLICATION ==================== -->
  <g transform="translate(214, 76)">
    <rect width="158" height="135" rx="8" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="158" height="3" rx="1.5" fill="#38BDF8" opacity="0.6"/>
    <g transform="translate(14, 22)">
      <text class="mono node-step" x="0" y="0">STAGE 02</text>
      <text class="sans node-title" x="0" y="20">AI Application</text>
      <text class="mono node-desc" x="0" y="44">◈ FastAPI Backend</text>
      <text class="mono node-desc" x="0" y="60">◈ Schema Validation</text>
      <text class="mono node-desc" x="0" y="76">◈ State Orchestrator</text>
      <text class="mono node-desc" x="0" y="92">◈ Session Context</text>
    </g>
  </g>

  <!-- ==================== NODE 3: RAG / LLM CORE ==================== -->
  <g transform="translate(404, 76)">
    <rect width="158" height="135" rx="8" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="158" height="3" rx="1.5" fill="#00F2FE" opacity="0.8"/>
    <g transform="translate(14, 22)">
      <text class="mono node-step" x="0" y="0">STAGE 03</text>
      <text class="sans node-title" x="0" y="20">RAG / LLM Core</text>
      <text class="mono node-desc" x="0" y="44">◈ Vector Retrieval</text>
      <text class="mono node-desc" x="0" y="60">◈ Policy Grounding</text>
      <text class="mono node-desc" x="0" y="76">◈ Semantic Parser</text>
      <text class="mono node-desc" x="0" y="92">◈ Intent Inference</text>
    </g>
  </g>

  <!-- ==================== NODE 4: DECISION ENGINE (IntentOS) ==================== -->
  <!-- Highlighted Core Controller -->
  <g transform="translate(594, 68)">
    <rect width="178" height="151" rx="9" fill="url(#card-highlight)" stroke="#0284C7" stroke-width="1.6"/>
    <rect x="0" y="0" width="178" height="3.5" rx="1.5" fill="#00F2FE"/>
    <g transform="translate(14, 20)">
      <text class="mono node-step" x="0" y="0" fill="#00F2FE">STAGE 04 // GATEWAY</text>
      <text class="sans node-title" x="0" y="18" font-size="13.5">Decision Engine</text>
      <text class="mono" x="0" y="32" font-size="9" fill="#38BDF8">IntentOS Controller</text>
      
      <!-- Decision Path Badges -->
      <g transform="translate(0, 44)">
        <!-- ACT -->
        <g transform="translate(0, 0)">
          <rect width="45" height="18" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
          <text class="mono" x="22.5" y="12" font-size="8.5" fill="#6EE7B7" font-weight="700" text-anchor="middle">ACT</text>
          <text class="sans" x="52" y="12.5" font-size="8.5" fill="#94A3B8">Safe &amp; Clear</text>
        </g>
        <!-- ASK -->
        <g transform="translate(0, 24)">
          <rect width="45" height="18" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="0.8"/>
          <text class="mono" x="22.5" y="12" font-size="8.5" fill="#FDE68A" font-weight="700" text-anchor="middle">ASK</text>
          <text class="sans" x="52" y="12.5" font-size="8.5" fill="#94A3B8">Ambiguous Intent</text>
        </g>
        <!-- REVIEW -->
        <g transform="translate(0, 48)">
          <rect width="45" height="18" rx="4" fill="#450A0A" stroke="#EF4444" stroke-width="0.8"/>
          <text class="mono" x="22.5" y="12" font-size="8.5" fill="#FECACA" font-weight="700" text-anchor="middle">REVIEW</text>
          <text class="sans" x="52" y="12.5" font-size="8.5" fill="#94A3B8">High Consequence</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== NODE 5: AI AGENT OUTPUT ==================== -->
  <g transform="translate(804, 76)">
    <rect width="172" height="135" rx="8" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="172" height="3" rx="1.5" fill="#10B981" opacity="0.8"/>
    <g transform="translate(14, 22)">
      <text class="mono node-step" x="0" y="0" fill="#10B981">STAGE 05</text>
      <text class="sans node-title" x="0" y="20">AI Agent Output</text>
      <text class="mono node-desc" x="0" y="44">◈ Autonomous Tool Call</text>
      <text class="mono node-desc" x="0" y="60">◈ User Clarification Loop</text>
      <text class="mono node-desc" x="0" y="76">◈ HITL Verification Sign-off</text>
      <text class="mono node-desc" x="0" y="92">◈ Audited Execution Log</text>
    </g>
  </g>

  <!-- Footer Technical Note -->
  <g transform="translate(24, 248)">
    <text class="mono" x="0" y="0" font-size="9" fill="#475569">
      DETERMINISTIC BOUNDARIES PREVENT UNBOUNDED AGENCY, SILENT FAILS, AND ARBITRARY TOOL INVOCATIONS
    </text>
  </g>
</svg>
