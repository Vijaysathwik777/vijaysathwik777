<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="electric-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial Background Glow -->
    <radialGradient id="ambient-cyan" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-blue" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.5px; fill: #F8FAFC; }
    .subtitle { font-weight: 600; letter-spacing: 3.5px; fill: #38BDF8; }
    .tag { font-size: 11px; fill: #00F2FE; font-weight: 600; letter-spacing: 1.5px; }
    .desc { font-size: 13.5px; fill: #94A3B8; font-weight: 400; line-height: 1.6; }
    .stat-val { font-weight: 700; fill: #F1F5F9; font-size: 13px; }
    .stat-label { fill: #64748B; font-size: 10px; font-weight: 500; letter-spacing: 1px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="14" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="340" rx="14" fill="url(#tech-grid)"/>

  <!-- Ambient Light Halos -->
  <rect width="1200" height="340" rx="14" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="340" rx="14" fill="url(#ambient-blue)"/>

  <!-- Premium Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="338" rx="13" fill="none" stroke="url(#accent-line)" stroke-width="1"/>

  <!-- ==================== RIGHT SIDE: NEURAL AGENT NETWORK ==================== -->
  <g transform="translate(680, 20)">
    <!-- Ambient circle backdrop for graph -->
    <circle cx="280" cy="150" r="130" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
    <circle cx="280" cy="150" r="85" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>

    <!-- Synaptic Network Edges -->
    <!-- Input layer to Hidden 1 -->
    <line x1="60" y1="90" x2="160" y2="60" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="60" y1="90" x2="160" y2="130" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="60" y1="170" x2="160" y2="130" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="60" y1="170" x2="160" y2="210" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="60" y1="240" x2="160" y2="210" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Hidden 1 to Decision Nexus -->
    <line x1="160" y1="60" x2="280" y2="100" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45"/>
    <line x1="160" y1="130" x2="280" y2="100" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.65"/>
    <line x1="160" y1="130" x2="280" y2="180" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.65"/>
    <line x1="160" y1="210" x2="280" y2="180" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Decision Nexus Cross-connections -->
    <line x1="280" y1="100" x2="280" y2="180" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 3"/>

    <!-- Decision Nexus to Action Outcomes -->
    <line x1="280" y1="100" x2="400" y2="70" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="280" y1="100" x2="400" y2="140" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.65"/>
    <line x1="280" y1="180" x2="400" y2="140" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.65"/>
    <line x1="280" y1="180" x2="400" y2="210" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.75"/>

    <!-- Feedback Loop Arch -->
    <path d="M 400 70 Q 450 140 400 210 Q 340 270 160 210" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3"/>

    <!-- Nodes - Layer 1 (Perception/Input) -->
    <circle cx="60" cy="90" r="5" fill="#0E1E38" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="60" cy="90" r="2" fill="#38BDF8"/>
    <circle cx="60" cy="170" r="6" fill="#0E1E38" stroke="#00F2FE" stroke-width="1.5" filter="url(#glow-blur)"/>
    <circle cx="60" cy="170" r="2.5" fill="#00F2FE"/>
    <circle cx="60" cy="240" r="5" fill="#0E1E38" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="60" cy="240" r="2" fill="#38BDF8"/>

    <!-- Nodes - Layer 2 (RAG & Semantic Embedding) -->
    <circle cx="160" cy="60" r="6" fill="#0E1E38" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="160" cy="60" r="2.5" fill="#38BDF8"/>
    <circle cx="160" cy="130" r="8" fill="#082F49" stroke="#00F2FE" stroke-width="2" filter="url(#glow-blur)"/>
    <circle cx="160" cy="130" r="3.5" fill="#E0F2FE"/>
    <circle cx="160" cy="210" r="6" fill="#0E1E38" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="160" cy="210" r="2.5" fill="#38BDF8"/>

    <!-- Nodes - Layer 3 (Central Decision Controller / IntentOS Hub) -->
    <g transform="translate(280, 100)">
      <circle cx="0" cy="0" r="14" fill="#0C2340" stroke="#00F2FE" stroke-width="2" filter="url(#glow-blur)"/>
      <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
    <g transform="translate(280, 180)">
      <circle cx="0" cy="0" r="12" fill="#0C2340" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#0284C7"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Nodes - Layer 4 (Execution Outcomes: ACT, ASK, REVIEW) -->
    <!-- ACT (Safe Autonomous Action) -->
    <g transform="translate(400, 70)">
      <circle cx="0" cy="0" r="7" fill="#064E3B" stroke="#10B981" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="2.5" fill="#A7F3D0"/>
      <text class="mono" x="14" y="4" font-size="9.5" fill="#10B981" font-weight="700">ACT</text>
    </g>
    <!-- ASK (Clarification Gate) -->
    <g transform="translate(400, 140)">
      <circle cx="0" cy="0" r="7" fill="#451A03" stroke="#F59E0B" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="2.5" fill="#FDE68A"/>
      <text class="mono" x="14" y="4" font-size="9.5" fill="#F59E0B" font-weight="700">ASK</text>
    </g>
    <!-- REVIEW (Human Sign-Off) -->
    <g transform="translate(400, 210)">
      <circle cx="0" cy="0" r="7" fill="#450A0A" stroke="#EF4444" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="2.5" fill="#FECACA"/>
      <text class="mono" x="14" y="4" font-size="9.5" fill="#EF4444" font-weight="700">REVIEW</text>
    </g>

    <!-- Node Labels in Subtle Monospace -->
    <text class="mono" x="22" y="278" font-size="8.5" fill="#475569" letter-spacing="1">SEMANTIC GRAPH // DETERMINISTIC CONTROL</text>
  </g>

  <!-- ==================== LEFT SIDE: HERO BRANDING ==================== -->
  <g transform="translate(70, 52)">
    <!-- Top System Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="24" rx="12" fill="#0B1528" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#00F2FE" filter="url(#glow-blur)"/>
      <text class="mono tag" x="24" y="15.5">AGENTIC AI &amp; AUTONOMOUS SYSTEMS</text>
    </g>

    <!-- Name / Primary Title -->
    <text class="sans title" x="0" y="68" font-size="44">VIJAY SATHWIK</text>

    <!-- Headline / Role -->
    <text class="mono subtitle" x="1" y="98" font-size="14.5">AI ENGINEER  |  AGENTIC AI DEVELOPER</text>

    <!-- Description -->
    <text class="sans desc" x="1" y="132">Architecting reliable decision controllers, deterministic agent pipelines,</text>
    <text class="sans desc" x="1" y="152">and production RAG systems with strict safety and execution boundaries.</text>

    <!-- Technical Badges Strip -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Decision Controllers -->
      <g transform="translate(0, 0)">
        <rect width="170" height="26" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
        <text class="mono" x="12" y="17" font-size="10" fill="#38BDF8">◈ Decision Engines</text>
      </g>
      <!-- Pill 2: RAG & LLMs -->
      <g transform="translate(180, 0)">
        <rect width="135" height="26" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
        <text class="mono" x="12" y="17" font-size="10" fill="#38BDF8">◈ Grounded RAG</text>
      </g>
      <!-- Pill 3: Autonomous Agents -->
      <g transform="translate(325, 0)">
        <rect width="145" height="26" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
        <text class="mono" x="12" y="17" font-size="10" fill="#38BDF8">◈ Autonomous Agents</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER TECHNICAL METRICS BAR ==================== -->
  <g transform="translate(70, 298)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(0, 18)">
      <text class="mono stat-label" x="0" y="0">PRIMARY FOCUS</text>
      <text class="sans stat-val" x="105" y="0">Agent Decision Layers &amp; Reliable Workflows</text>
    </g>

    <g transform="translate(560, 18)">
      <text class="mono stat-label" x="0" y="0">CORE STACK</text>
      <text class="mono stat-val" x="80" y="0" font-size="11.5" fill="#38BDF8">Python • FastAPI • LLMs • RAG • Docker</text>
    </g>

    <g transform="translate(970, 18)">
      <circle cx="-10" cy="-3.5" r="3" fill="#10B981"/>
      <text class="mono" x="0" y="0" font-size="10.5" fill="#94A3B8">BUILDING IN PUBLIC</text>
    </g>
  </g>

  <!-- Precision Corner Tech Marks -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 12 316 L 12 328 L 24 328" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1188 316 L 1188 328 L 1176 328" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
</svg>
